name: Draft governance effect

# When the league's dispatch job (scripts/dispatch_effects.py, running on the Pi)
# files a "[gov-effect]" issue for a passed bylaw that needs a brand-new bounded
# effect, let the Claude Code GitHub Action implement it on a branch and open a
# pull request. The PR is NEVER merged automatically: the commissioner reviews
# and merges, then the Pi enacts the bylaw with `review_bylaws --auto <id>`.
#
# Only issues whose title starts with "[gov-effect]" start a runner (the `if`
# below); the issue body carries the "@claude" trigger and the implementation
# brief, so the action runs in interactive mode and turns the issue into a PR.
#
# Setup (one time): install the Claude GitHub App on this repo and add an
# ANTHROPIC_API_KEY repository secret. See docs/agent-effects.md.

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

jobs:
  draft-effect:
    # gov-effect issues on open; and a re-run when someone @claude-comments on one
    # (used to retry a run that failed or timed out, without re-filing the issue).
    if: >-
      startsWith(github.event.issue.title, '[gov-effect]') &&
      (github.event_name != 'issue_comment' ||
       contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write        # create the branch / commit the new effect
      pull-requests: write   # open the PR
      issues: write          # comment progress on the issue
      id-token: write        # Claude GitHub App authentication
      actions: read          # read CI results
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      # Make Python + the project deps available so the agent can run the test
      # suites itself before opening the PR (its brief tells it to). The tests.yml
      # workflow re-runs them on the PR regardless, as the hard gate.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - uses: anthropics/claude-code-action@v1
        env:
          # Authenticate the gh CLI so the agent can open the PR itself (step 6
          # of the brief). github.token carries the job's pull-requests: write.
          GH_TOKEN: ${{ github.token }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Additively allow the agent to run Python (its own tests) and the gh
          # CLI (to open the PR) without an approval prompt. `settings` ADDS to
          # the permission allowlist and leaves the action's built-in edit/git
          # tools untouched.
          settings: |
            {"permissions": {"allow": ["Bash(python:*)", "Bash(python3:*)", "Bash(pip:*)", "Bash(gh:*)"]}}
          claude_args: |
            --max-turns 150
            --model claude-sonnet-5
