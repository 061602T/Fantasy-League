name: Claude Code Review

# Automatic Claude review on every pull request -- including the "[gov-effect]"
# PRs the coding agent opens. Claude posts ONE detailed, plain-English summary
# comment on the PR (what changed, a bounded/safety assessment, concerns with
# file:line, and a clear verdict). It never approves or merges: a human still
# clicks merge, now with a readable review in hand.
#
# Uses the ANTHROPIC_API_KEY secret and Claude GitHub App already set up (see
# docs/agent-effects.md). The summary is posted with `gh` authenticated by the
# built-in GITHUB_TOKEN, so it needs pull-requests: write. allowed_bots lets the
# review run on the App-authored agent PRs.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          allowed_bots: "*"
          prompt: |
            Review pull request #${{ github.event.pull_request.number }} in
            ${{ github.repository }}. Inspect the diff against
            origin/${{ github.event.pull_request.base.ref }} with
            `gh pr diff ${{ github.event.pull_request.number }}` and read whatever
            files you need for context.

            This repository is an autonomous AI fantasy league. Most PRs add a new
            BOUNDED governance "effect". Assess, specifically:
            - Is any new effect bounds-checked and validated (rejects out-of-range
              or missing params) the same way the existing effects in
              ffl/effects.py are?
            - Is it registered in BOTH the EFFECTS registry AND EFFECT_META in
              ffl/effects.py (EFFECT_META is what makes `--auto` pick it up)?
            - Are there tests in scripts/test_governance.py, and do they look
              like they would pass?
            - Does it touch anything it should NOT: secrets, .env, CI/workflow
              files under .github/, the SQLite DB, or unrelated modules? Flag any
              such change loudly.
            - Any ordinary bugs, missing edge cases, or unsafe SQL.

            Then post EXACTLY ONE top-level summary comment on the PR with:
              gh pr comment ${{ github.event.pull_request.number }} --body "<summary>"
            Write the summary in clear, plain English for a non-expert
            maintainer. Structure it as:
              1. **What this PR does** — 2-3 sentences.
              2. **Safety & bounds** — is the effect properly bounded/validated/
                 registered; did it touch anything off-limits.
              3. **Findings** — bullet each concern with file:line, or "none".
              4. **Verdict** — one of: SAFE TO MERGE / NEEDS A FIX (say what) /
                 REJECT (say why), with one line of reasoning.
            End the comment body with this footer on its own lines:

            ---
            _Generated by [Claude Code](https://claude.ai/code)_
          claude_args: |
            --max-turns 40
            --model claude-sonnet-5
            --allowedTools "Read,Grep,Glob,Bash(git diff:*),Bash(git log:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*)"
