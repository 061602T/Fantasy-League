name: Claude Code Review

# Automatic Claude review on every pull request -- including the "[gov-effect]"
# PRs the coding agent opens. Claude posts its findings as inline comments,
# tagged by severity. It never approves or merges: a human still clicks merge,
# now with Claude's read of the diff in hand.
#
# Uses the ANTHROPIC_API_KEY secret and the Claude GitHub App already set up for
# this repo (see docs/agent-effects.md), billed pay-as-you-go on the API key.
#
# allowed_bots: the coding-agent PRs are authored by the Claude GitHub App (a
# bot). Without this, the action's human-actor guard would skip them, so bot
# authors are allowed here. Review-only (comments), so this can't drive a loop.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          allowed_bots: "*"
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
